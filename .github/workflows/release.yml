name: release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./scripts/build.sh
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/velocity_scale-module.tar.gz
